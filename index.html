<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Estética v10</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f11;--bg2:#161619;--bg3:#1e1e22;--bg4:#26262c;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e8e6e0;--text2:#9a9890;--text3:#5a5856;
  --accent:#e8c547;--accent2:#b89a2a;
  --green:#4ade80;--green-bg:rgba(74,222,128,0.1);
  --red:#f87171;--red-bg:rgba(248,113,113,0.1);
  --blue:#60a5fa;--blue-bg:rgba(96,165,250,0.1);
  --orange:#fb923c;--orange-bg:rgba(251,146,60,0.1);
  --purple:#c084fc;--purple-bg:rgba(192,132,252,0.1);
  --br:8px;--brl:12px;--brxl:16px;
  font-family:'DM Sans',sans-serif;
}
body{background:var(--bg);color:var(--text);min-height:100vh;font-size:13px;line-height:1.5;overflow:hidden}
#login-area{overflow-y:auto}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:6px;padding:0 16px;height:48px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.brand-wrap{display:flex;align-items:center;gap:6px;margin-right:8px;position:relative}
.brand{font-size:13px;font-weight:600;color:var(--accent);cursor:pointer;display:flex;align-items:center;gap:4px}
.brand:hover{opacity:.8}
.empresa-dropdown{position:absolute;top:calc(100% + 8px);left:0;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--brl);min-width:220px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
.empresa-dropdown.open{display:block}
.empresa-item{padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;transition:background .12s;border-bottom:1px solid var(--border)}
.empresa-item:hover{background:var(--bg3)}
.empresa-item.active{color:var(--accent);font-weight:500}
.empresa-item:last-child{border-bottom:none}
.nav-btn{padding:5px 12px;border-radius:6px;border:1px solid transparent;background:transparent;font-size:12px;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s}
.nav-btn:hover{background:var(--bg3);color:var(--text)}.nav-btn.active{background:var(--bg4);color:var(--text);border-color:var(--border2)}
.topbar-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.btn-novo-lead{padding:8px 18px;border-radius:8px;border:none;background:var(--accent);color:#000;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-novo-lead:hover{background:var(--accent2)}
.main{display:flex;flex:1;overflow:hidden}

/* FILTROS */
.filter-bar{display:flex;gap:6px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;align-items:center}
.filter-btn{padding:5px 14px;border-radius:20px;border:1px solid var(--border2);background:transparent;font-size:12px;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s}
.filter-btn:hover{background:var(--bg3);color:var(--text)}.filter-btn.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}

/* PERIOD FILTER */
.period-filter{display:flex;gap:4px;margin-left:auto}
.period-btn{padding:4px 10px;border-radius:6px;border:1px solid var(--border2);background:transparent;font-size:11px;color:var(--text3);cursor:pointer;font-family:inherit;transition:all .15s}
.period-btn:hover{color:var(--text2)}.period-btn.active{background:var(--bg4);color:var(--accent);border-color:rgba(232,197,71,.3)}

/* CONFIG */
.config-wrap{flex:1;overflow-y:auto;padding:20px}
.config-block{background:var(--bg2);border:1px solid var(--border);border-radius:var(--brxl);padding:18px;margin-bottom:14px;max-width:860px}
.config-block h3{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.form-input{padding:8px 10px;border:1px solid var(--border2);border-radius:var(--br);background:var(--bg3);color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border .15s}
.form-input:focus{border-color:var(--accent)}
select.form-input option{background:var(--bg3)}textarea.form-input{resize:vertical;line-height:1.6}
.btn{padding:7px 16px;border-radius:8px;border:1px solid var(--border2);background:transparent;font-size:12px;color:var(--text);cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s}
.btn:hover{background:var(--bg3)}.btn.primary{background:var(--accent);color:#000;border-color:var(--accent)}.btn.primary:hover{background:var(--accent2)}
.btn.danger{background:var(--red-bg);color:var(--red);border-color:rgba(248,113,113,.3)}.btn.sm{padding:4px 10px;font-size:11px}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500}
.badge.red{background:var(--red-bg);color:var(--red)}.badge.orange{background:var(--orange-bg);color:var(--orange)}
.badge.green{background:var(--green-bg);color:var(--green)}.badge.blue{background:var(--blue-bg);color:var(--blue)}
.badge.accent{background:rgba(232,197,71,.15);color:var(--accent)}.badge.gray{background:var(--bg4);color:var(--text2)}.badge.purple{background:var(--purple-bg);color:var(--purple)}

/* NOTIFICAÇÃO RETORNO */
.retorno-alert{padding:8px 16px;background:rgba(192,132,252,.12);border-bottom:2px solid var(--purple);display:flex;align-items:center;gap:10px;flex-shrink:0;cursor:pointer}
.retorno-alert:hover{background:rgba(192,132,252,.18)}

/* COCKPIT */
.cockpit{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.cockpit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.cockpit-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--brl);padding:10px 14px}
.cockpit-num{font-size:22px;font-weight:600;font-family:'DM Mono',monospace;line-height:1;margin-bottom:2px}
.cockpit-lbl{font-size:11px;color:var(--text2);margin-bottom:2px}
.cockpit-periodo{font-size:10px;color:var(--text3);margin-bottom:5px}
.prog-bar{height:4px;background:var(--bg4);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .4s}
.quick-btns{display:flex;gap:6px;flex-wrap:wrap}

/* BUSCA GLOBAL */
.global-search-wrap{padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;position:relative}
.global-search{width:100%;padding:9px 14px;border:1px solid var(--border2);border-radius:var(--brl);background:var(--bg3);color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border .15s}
.global-search:focus{border-color:var(--accent)}
.search-results{position:absolute;left:16px;right:16px;top:calc(100% - 2px);background:var(--bg2);border:1px solid var(--border2);border-radius:var(--brl);overflow:hidden;display:none;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.search-results.show{display:block}
.search-result-item{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .12s}
.search-result-item:hover,.search-result-item.selected{background:var(--bg3)}.search-result-item:last-child{border-bottom:none}

/* WORK */
.work-layout{display:flex;flex:1;overflow:hidden}
.queue-panel{width:260px;border-right:1px solid var(--border);overflow-y:auto;background:var(--bg);flex-shrink:0;display:flex;flex-direction:column}
.queue-funnel-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg);overflow-x:auto;flex-shrink:0;position:sticky;top:0;z-index:10}
.qft{flex:1;padding:7px 4px;text-align:center;font-size:10px;font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;min-width:50px}
.qft:hover{color:var(--text2)}.qft.active{color:var(--accent);border-bottom-color:var(--accent)}
.qft-count{display:inline-block;background:var(--bg4);border-radius:8px;padding:0 5px;font-size:9px;margin-left:2px;font-family:'DM Mono',monospace}
.qft.active .qft-count{background:rgba(232,197,71,.15);color:var(--accent)}
.queue-item{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:all .15s}
.queue-item:hover{background:var(--bg2)}.queue-item.active{background:rgba(232,197,71,0.07);border-left:2px solid var(--accent);padding-left:12px}
.qi-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:2px}
.qi-name{font-size:13px;font-weight:500;color:var(--text)}.qi-time{font-size:10px;font-family:'DM Mono',monospace;white-space:nowrap}
.qi-time.hot{color:var(--orange)}.qi-time.neutral{color:var(--text3)}.qi-time.cold{color:var(--red)}
.qi-sub{font-size:11px;color:var(--text2);margin-bottom:4px}.qi-badges{display:flex;gap:3px;flex-wrap:wrap}
.lead-detail{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.detail-empty{display:flex;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text3)}

/* LEAD CARD */
.lead-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--brxl);padding:18px}
.lead-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.lead-header-info{flex:1;min-width:0}
.lead-name-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.lead-name{font-size:16px;font-weight:600}
.lead-meta{font-size:12px;color:var(--text2);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.lead-actions-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.lead-actions-right{margin-left:auto;display:flex;gap:4px;flex-shrink:0}

.dia-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:600;margin-bottom:10px;border:1px solid}
.dia-badge.d1,.dia-badge.q1,.dia-badge.r1{background:rgba(232,197,71,.15);color:var(--accent);border-color:rgba(232,197,71,.3)}
.dia-badge.d2,.dia-badge.q2,.dia-badge.r2{background:var(--blue-bg);color:var(--blue);border-color:rgba(96,165,250,.3)}
.dia-badge.d3,.dia-badge.q3,.dia-badge.r3{background:var(--orange-bg);color:var(--orange);border-color:rgba(251,146,60,.3)}
.dia-badge.d4,.dia-badge.q4{background:var(--blue-bg);color:var(--blue);border-color:rgba(96,165,250,.3)}
.dia-badge.d5,.dia-badge.q5{background:var(--red-bg);color:var(--red);border-color:rgba(248,113,113,.3)}

.script-box{background:var(--bg3);border:1px solid rgba(232,197,71,.2);border-radius:var(--br);padding:12px;margin-bottom:10px}
.script-box-label{font-size:10px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.script-box-text{font-size:12px;color:var(--text2);line-height:1.6;white-space:pre-wrap}

.tent-block{background:var(--bg3);border:1px solid var(--border);border-radius:var(--brl);overflow:hidden;margin-bottom:6px}
.tent-block.current{border-color:var(--border2);background:var(--bg2)}
.tent-header{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background .12s}
.tent-header:hover{background:var(--bg4)}
.tent-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;font-family:'DM Mono',monospace;flex-shrink:0;background:var(--bg4);color:var(--text3);border:1px solid var(--border2)}
.tent-num.done{background:rgba(74,222,128,.15);color:var(--green);border-color:rgba(74,222,128,.3)}
.tent-num.fail{background:var(--red-bg);color:var(--red);border-color:rgba(248,113,113,.3)}
.tent-num.current{background:rgba(232,197,71,.15);color:var(--accent);border-color:rgba(232,197,71,.3)}
.tent-result{flex:1;font-size:12px;color:var(--text2)}.tent-datetime{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;white-space:nowrap}
.tent-body{padding:12px 14px;border-top:1px solid var(--border);display:none}.tent-body.open{display:block}
.result-btns{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.result-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border2);background:transparent;font-size:11px;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s}
.result-btn:hover{background:var(--bg4)}.result-btn.active{font-weight:600}
.result-btn.active.msg-enviada{background:var(--blue-bg);color:var(--blue);border-color:rgba(96,165,250,.3)}
.result-btn.active.viu-nao-resp{background:var(--orange-bg);color:var(--orange);border-color:rgba(251,146,60,.3)}
.result-btn.active.nao-atendeu,.result-btn.active.rejeitou{background:var(--red-bg);color:var(--red);border-color:rgba(248,113,113,.3)}
.result-btn.active.caiu,.result-btn.active.ocupado{background:var(--orange-bg);color:var(--orange);border-color:rgba(251,146,60,.3)}
.result-btn.active.respondeu,.result-btn.active.agendou{background:var(--green-bg);color:var(--green);border-color:rgba(74,222,128,.3)}

.hora-resp-box{background:var(--bg4);border-radius:var(--br);padding:8px 10px;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-size:12px}

.action-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:8px;border:1px solid var(--border2);background:transparent;font-size:11px;color:var(--text);cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s;text-decoration:none;white-space:nowrap}
.action-btn:hover{background:var(--bg4)}.action-btn.green{background:var(--green-bg);border-color:rgba(74,222,128,.3);color:var(--green)}
.action-btn.orange{background:var(--orange-bg);border-color:rgba(251,146,60,.3);color:var(--orange)}
.action-btn.red{background:var(--red-bg);border-color:rgba(248,113,113,.3);color:var(--red)}
.action-btn.purple{background:var(--purple-bg);border-color:rgba(192,132,252,.3);color:var(--purple)}
.action-btn.accent{background:rgba(232,197,71,.12);border-color:rgba(232,197,71,.3);color:var(--accent)}
.action-btn.wa{background:rgba(37,211,102,.12);border-color:rgba(37,211,102,.3);color:#25d366}

.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field-item{background:var(--bg3);border-radius:var(--br);padding:10px 12px}
.field-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.field-input{width:100%;background:transparent;border:none;outline:none;font-size:13px;color:var(--text);font-family:inherit}
.notes-area{background:var(--bg3);border:1px solid var(--border);border-radius:var(--br);padding:10px 12px;font-size:12px;color:var(--text);width:100%;font-family:inherit;resize:none;outline:none;transition:border .15s;line-height:1.6}
.notes-area:focus{border-color:var(--border2)}
.section-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.alert-box{border-radius:var(--br);padding:8px 12px;font-size:12px;display:flex;align-items:center;gap:8px}
.alert-box.info{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(96,165,250,.2)}
.alert-box.danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(248,113,113,.2)}
.toque-item{background:var(--bg3);border:1px solid var(--border);border-radius:var(--br);padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.toque-item.hoje{border-color:rgba(232,197,71,.3);background:rgba(232,197,71,.05)}
.toque-item.vencido{border-color:rgba(248,113,113,.3);background:var(--red-bg)}
.toque-check{width:20px;height:20px;border-radius:50%;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:10px;transition:all .15s}
.toque-check.done{background:var(--green-bg);border-color:rgba(74,222,128,.3);color:var(--green)}

/* KANBAN */
.kanban-view{flex:1;overflow:hidden;display:flex;flex-direction:column}
.kanban-cards-topo{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.kanban-funil-card{border-radius:var(--brl);padding:14px 16px;cursor:pointer;transition:all .15s;border:2px solid transparent}
.kanban-funil-card:hover{transform:translateY(-2px)}.kanban-funil-card.active{border-color:rgba(255,255,255,.2)}
.kanban-funil-num{font-size:28px;font-weight:600;font-family:'DM Mono',monospace;line-height:1;margin-bottom:4px}
.kanban-funil-label{font-size:12px;font-weight:500}.kanban-funil-sub{font-size:10px;opacity:.7;margin-top:2px}
.kanban-board{display:flex;gap:10px;overflow-x:auto;padding:14px;flex:1;align-items:flex-start}
.k-col{flex:0 0 185px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--brl);display:flex;flex-direction:column;max-height:100%}
.k-col-header{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.k-col-title{font-size:12px;font-weight:600;flex:1}.k-col-count{font-size:11px;font-weight:600;font-family:'DM Mono',monospace}
.k-cards{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:60px}
.k-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--br);padding:9px 10px;cursor:pointer;transition:all .15s}
.k-card:hover{border-color:var(--border2);transform:translateY(-1px)}.k-col.drag-over{border-color:var(--accent)!important}

/* RELATÓRIOS */
.reports-view{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.report-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--brxl);padding:18px}
.report-card.full{grid-column:1/-1}
.report-title{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.report-desc{font-size:11px;color:var(--text3);margin-bottom:14px;line-height:1.5}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.stat-row:last-child{border-bottom:none}
.funnel-step{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.funnel-step:last-child{border-bottom:none}
.funnel-step-label{width:110px;font-size:12px;color:var(--text2);flex-shrink:0}
.funnel-step-bar{flex:1;background:var(--bg3);border-radius:4px;height:22px;overflow:hidden}
.funnel-step-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:11px;font-weight:600;color:#000;min-width:24px}
.funnel-step-pct{font-size:11px;font-weight:600;width:40px;text-align:right;flex-shrink:0;font-family:'DM Mono',monospace}
.funnel-step-ok{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.insight-box{border-radius:var(--br);padding:12px;font-size:12px;line-height:1.6;margin-bottom:8px;border-left:3px solid}
.insight-box.ok{background:rgba(74,222,128,.07);color:var(--text2);border-left-color:var(--green)}
.insight-box.warn{background:rgba(248,113,113,.07);color:var(--text2);border-left-color:var(--red)}
.insight-box.info{background:var(--blue-bg);color:var(--text2);border-left-color:var(--blue)}
.hora-chart{display:flex;align-items:flex-end;gap:4px;height:80px}
.hora-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}

// Gera senha baseada no email
function gerarSenha(email){
  const partes=email.split('@')[0].replace(/[^a-zA-Z0-9]/g,'');
  const base=partes.slice(0,4).toLowerCase();
  const num=Math.floor(1000+Math.random()*9000);
  const esp=['!','@','#','$'][Math.floor(Math.random()*4)];
  return base+num+esp;
}

async function enviarRecuperacao(){
  const email=document.getElementById('rec-email')?.value.trim();
  if(!email){toast('Digite seu email');return;}
  const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin});
  const el=document.getElementById('rec-msg');
  if(error){el.style.color='var(--red)';el.textContent='Erro: '+error.message;}
  else{el.style.color='var(--green)';el.textContent='Link enviado! Verifique seu email.';}
  el.style.display='block';
}

async function fazerLogin(){
  const email=document.getElementById('login-email')?.value.trim();
  const senha=document.getElementById('login-senha')?.value;
  const erro=document.getElementById('login-erro');
  const btn=document.querySelector('#app button.btn.primary');
  if(!email||!senha){erro.textContent='Preencha email e senha';erro.style.display='block';return;}
  erro.style.display='none';
  if(btn){btn.textContent='entrando...';btn.disabled=true;}
  try{
    const{data,error}=await sb.auth.signInWithPassword({email,password:senha});
    if(error){
      erro.textContent=error.message==='Invalid login credentials'?'Email ou senha incorretos':
        error.message==='Email not confirmed'?'Email não confirmado — fale com o administrador':
        'Erro: '+error.message;
      erro.style.display='block';
      if(btn){btn.textContent='entrar';btn.disabled=false;}
      return;
    }
    if(data?.user){
      if(btn){btn.textContent='carregando...';}
      await iniciarApp();
    }
  }catch(e){
    erro.textContent='Erro de conexão — verifique sua internet';
    erro.style.display='block';
    if(btn){btn.textContent='entrar';btn.disabled=false;}
  }
}

function getEmpresas(){try{return JSON.parse(localStorage.getItem('crm_empresas')||'[]')}catch(e){return[]}}
function saveEmpresas(e){localStorage.setItem('crm_empresas',JSON.stringify(e))}
function getEmpresaAtual(){return localStorage.getItem('crm_empresa_atual')||''}
function setEmpresaAtual(id){localStorage.setItem('crm_empresa_atual',id)}

// Sincroniza empresas do Supabase para o cache local
async function syncEmpresas(){
  try{
    const{data:rows,error:e1}=await sb.from('empresas').select('*');
    if(e1){console.warn('sync empresas',e1);return getEmpresas();}
    if(rows&&rows.length){
      const list=rows.map(r=>({id:r.id,nome:r.nome}));
      saveEmpresas(list);
      return list;
    }
  }catch(e){console.warn('sync empresas offline',e)}
  return getEmpresas();
}

async function syncConfigToSupabase(){

async function saveLead(leadObj){
  if(!leadObj||!empresaId)return;
  console.log('📤 saveLead chamado para:',leadObj.nome||leadObj.tel);
  // Cache local imediato
  const idx=S.leads.findIndex(l=>l.id===leadObj.id);
  if(idx>=0)S.leads[idx]=leadObj;else S.leads.push(leadObj);
  // Supabase async
  try{
    const row=leadToRow(leadObj);
    console.log('📦 Enviando para Supabase:',{id:row.id,nome:row.nome,data_entrada:row.data_entrada});
    const result=await sb.from('leads').upsert(row,{onConflict:'id'});
    console.log('✅ Resposta Supabase:',result);
    if(result.error){
      console.error('❌ ERRO Supabase:',result.error);
    }
  }catch(e){console.error('❌ ERRO sync lead:',e)}
}
async function deleteLead(id){
  S.leads=S.leads.filter(l=>l.id!==id);
  try{await sb.from('leads').delete().eq('id',id)}catch(e){}
  closeModal();advQ();toast('lead excluído');
}

    campanha:l.campanha||'',
    vendedor_id:l.vendedorId||null,vendedor_nome:l.vendedorNome||'',
    local:l.local||'',causa:l.causa||'',valor:l.valor||0,
    fechado:l.fechado||false,retorno_data:l.retornoData||null,
    tentativas:l.tentativas||[],toques:l.toques||[],
    fechamento:l.fechamento||null,
    data_entrada:l.dataEntrada||null,
    col_at:l.colAt?new Date(l.colAt).toISOString():new Date().toISOString(),
    respondeu_at:l.respondeuAt?new Date(l.respondeuAt).toISOString():null,
    prospectado_em:l.prospectadoEm?new Date(l.prospectadoEm).toISOString():null,
    qualificado_em:l.qualificadoEm?new Date(l.qualificadoEm).toISOString():null,
    fechado_em:l.fechadoEm?new Date(l.fechadoEm).toISOString():null,

function rowToLead(r){
  return{
    id:r.id,nome:r.nome||'',tel:r.tel||'',funnel:r.funnel||'prospeccao',

async function loadEmpresa(id){
  empresaId=id;setEmpresaAtual(id);
  showLoading('carregando dados...');
  // LIMPA os dados antigos ANTES de buscar os novos
  S.leads=[];
  S.config=DEFAULT_CONFIG();
  // Busca sempre do Supabase — sem cache local para dados
  try{
    const[cfgRes,leadRes]=await Promise.all([
      sb.from('configuracoes').select('*').eq('empresa_id',id),
      sb.from('leads').select('*').eq('empresa_id',id)
    ]);
    const cfgRows=cfgRes.data||[];
    const leadRows=leadRes.data||[];
    if(cfgRows.length){
      const cfg=cfgRows[0].dados;
      S.config={...DEFAULT_CONFIG(),...cfg,metas:{...DEFAULT_CONFIG().metas,...(cfg.metas||{})}};
    }
    if(leadRows.length){
      S.leads=leadRows.map(rowToLead);
    }
  }catch(e){console.warn('load offline',e)}
  migrarDiaProsp();
  hideLoading();
}

function migrarDiaProsp(){
  let alt=false;
  S.leads.forEach(l=>{
    if(l.funnel==='qualificacao'&&l.diaProsp?.startsWith('d')){l.diaProsp='q1';alt=true;}
    if(l.funnel==='retorno'&&(l.diaProsp?.startsWith('d')||l.diaProsp?.startsWith('q'))){l.diaProsp='r1';alt=true;}
    if(l.funnel==='prospeccao'&&(l.diaProsp?.startsWith('q')||l.diaProsp?.startsWith('r'))){l.diaProsp='d1';alt=true;}
    
    // Migração: leads sem dataEntrada pegam de colAt
    if(!l.dataEntrada&&l.colAt){
      l.dataEntrada=new Date(l.colAt).toISOString();
      alt=true;
    }
  });
  if(alt){
    S.leads.forEach(l=>saveLeadLocal(l));
    toast('Migração completa! Aguarde sincronização...');
  }
}

async function migrarDataEntradaManual(){
  showLoading('Migrando datas de entrada...');
  let count=0;
  for(const l of S.leads){
    if(!l.dataEntrada&&l.colAt){
      l.dataEntrada=new Date(l.colAt).toISOString();
      await saveLead(l);
      count++;
    }
  }
  hideLoading();
  toast(`✓ ${count} leads migrados!`);
  render();
}

function getPStart(p){return p==='semana'?weekStart():p==='mes'?monthStart():new Date().setHours(0,0,0,0)}
function getMetaCount(campo,periodo){const start=getPStart(periodo);return S.leads.filter(l=>l[campo]&&l[campo]>=start).length}
function getRelPStart(){
  const p=UI.relPeriodo||'semana';
  if(p==='personalizado')return UI.relDataDe?new Date(UI.relDataDe+'T00:00:00').getTime():0;
  return p==='hoje'?new Date().setHours(0,0,0,0):p==='semana'?weekStart():p==='mes'?monthStart():0;
}
function filterLeadsByPeriod(leads){
  if(UI.relPeriodo==='tudo')return leads;
  const start=getRelPStart();
  let filtered=leads.filter(l=>l.colAt&&l.colAt>=start);
  if(UI.relPeriodo==='personalizado'&&UI.relDataAte){
    const end=new Date(UI.relDataAte+'T23:59:59').getTime();
    filtered=filtered.filter(l=>l.colAt<=end);
  }
  return filtered;
}

function getMeusLeads(){
  // Gestor e superadmin veem todos; vendedor vê só os seus
  if(!USER||isPerfil('gestor')||isSuperAdmin())return S.leads;
  return S.leads.filter(l=>l.vendedorId===USER.id);
}
function getQueue(fid){
  const meus=getMeusLeads();
  let leads=fid==='retorno'?meus.filter(l=>l.funnel==='retorno'&&!l.fechado&&l.retornoData&&l.retornoData<=todayStr()):meus.filter(l=>l.funnel===fid&&!l.fechado);
  
  // FILTRO: Remove leads que completaram todas as tentativas de HOJE
  if(fid==='prospeccao'||fid==='qualificacao'){
    leads=leads.filter(l=>{
      const dias=getDias(l.funnel);
      const diaAtual=l.diaProsp||'d1';
      const diaConfig=dias.find(d=>d.id===diaAtual);
      if(!diaConfig)return true; // Se não tem config, mostra
      
      const tentativasConfigDia=diaConfig.tentativas||[];
      const totalTentativasDia=tentativasConfigDia.length;
      
      // Conta quantas tentativas JÁ TEM RESULTADO (completadas)
      const tentativas=l.tentativas||[];
      const tentativasCompletas=tentativas.filter(t=>t.resultado&&t.resultado!=='').length;
      
      // Se completou TODAS as tentativas configuradas para esse dia, esconde
      if(tentativasCompletas>=totalTentativasDia&&totalTentativasDia>0){
        return false; // Remove da fila
      }
      
      return true; // Mostra na fila
    });
  }
  
  // Ordenação configurável
  if(UI.queueSort==='newest'){
    return leads.sort((a,b)=>b.colAt-a.colAt); // Mais recentes primeiro
  }
  return leads.sort((a,b)=>a.colAt-b.colAt); // Mais antigos primeiro (padrão)
}
function getRetornosHoje(){return S.leads.filter(l=>l.funnel==='retorno'&&!l.fechado&&l.retornoData&&l.retornoData<=todayStr()).length}
function searchGlobal(q){
  if(!q||q.length<2)return[];
  const ql=q.toLowerCase().replace(/\D/g,'');const qt=q.toLowerCase();
  return S.leads.filter(l=>(ql&&(l.tel||'').replace(/\D/g,'').includes(ql))||(l.nome||'').toLowerCase().includes(qt)).slice(0,8);
}

function renderSearchResults(q){
  const el=document.getElementById('search-results');if(!el)return;
  if(!q||q.length<2){el.classList.remove('show');UI.searchSelectedIndex=-1;return;}
  const results=searchGlobal(q);
  if(!results.length){el.innerHTML='<div style="padding:12px 14px;font-size:12px;color:var(--text3)">nenhum lead encontrado</div>';el.classList.add('show');return;}
  
  UI.searchResults=results; // Guarda resultados para navegação com teclado
  
  el.innerHTML=results.map((l,idx)=>{
    const fInfo=FUNNELS.find(f=>f.id===l.funnel)||FUNNELS[0];
    const isSelected=idx===UI.searchSelectedIndex;
    return`<div class="search-result-item ${isSelected?'selected':''}" onclick="goToLead(${l.id})" data-lead-id="${l.id}">

}

function handleSearchKeydown(e){
  const results=UI.searchResults||[];
  if(!results.length)return;
  
  if(e.key==='ArrowDown'){
    e.preventDefault();
    UI.searchSelectedIndex=Math.min((UI.searchSelectedIndex||0)+1,results.length-1);
    renderSearchResults(UI.searchQuery);
  }else if(e.key==='ArrowUp'){
    e.preventDefault();
    UI.searchSelectedIndex=Math.max((UI.searchSelectedIndex||0)-1,0);
    renderSearchResults(UI.searchQuery);
  }else if(e.key==='Enter'){
    e.preventDefault();
    const idx=UI.searchSelectedIndex>=0?UI.searchSelectedIndex:0;
    if(results[idx]){
      goToLead(results[idx].id);
    }
  }else if(e.key==='Escape'){
    UI.searchQuery='';
    hideSearch();
    render();
  }
}

function hideSearch(){
  const el=document.getElementById('search-results');
  if(el)el.classList.remove('show');
  UI.searchSelectedIndex=-1;
  UI.searchResults=[];
}

function selectLead(id){UI.workActive=id;const ld=document.getElementById('lead-detail');const l=S.leads.find(x=>x.id===id);if(ld&&l)ld.innerHTML=renderLD(l);document.querySelectorAll('.queue-item').forEach(el=>el.classList.toggle('active',(el.getAttribute('onclick')||'').includes(`(${id})`)));}
function advQ(){
  const currentLead=S.leads.find(l=>l.id===UI.workActive);
  
  // Verifica se completou todas as tentativas do dia atual
  if(currentLead&&currentLead.funnel!=='clientes'){
    const dias=getDias(currentLead.funnel);
    const diaConfig=dias.find(d=>d.id===currentLead.diaProsp)||dias[0];
    const tentativasConfig=diaConfig.tentativas||[];
    const tentativasFeitas=(currentLead.tentativas||[]).filter(t=>t.resultado).length;
    
    // Se completou TODAS as tentativas do dia
    if(tentativasFeitas>=tentativasConfig.length&&tentativasConfig.length>0){
      // Avança pro próximo dia
      const diaIdx=dias.findIndex(d=>d.id===currentLead.diaProsp);
      if(diaIdx>=0&&diaIdx<dias.length-1){
        // Tem próximo dia
        const proximoDia=dias[diaIdx+1];
        currentLead.diaProsp=proximoDia.id;
        currentLead.tentativas=criarTentativasDia(currentLead.funnel,proximoDia.id);
        currentLead.colAt=Date.now(); // Atualiza timestamp
        saveLeadLocal(currentLead);
        toast(`✅ Avançou para ${proximoDia.label}!`);
      }
    }
  }
  
  // Avança na fila
  const leads=getQueue(UI.workFunnel);
  const idx=leads.findIndex(l=>l.id===UI.workActive);
  UI.workActive=(leads[idx+1]||leads[0])?.id||null;
  render();
}
function setFunnel(fid){UI.workFunnel=fid;UI.workActive=null;setTab('work')}
function toggleT(lid,i){const el=document.getElementById(`tb-${lid}-${i}`);if(el)el.classList.toggle('open')}
function setRes(lid,i,res){
  const l=S.leads.find(x=>x.id===lid);if(!l)return;
  if(!l.tentativas[i])l.tentativas[i]={tipo:'mensagem',resultado:'',obs:'',data:null,hora:null,horaResp:null};
  l.tentativas[i].resultado=res;l.tentativas[i].data=Date.now();l.tentativas[i].hora=new Date().getHours();
  if(res==='respondeu'||res==='agendou'){
    if(!l.respondeuAt)l.respondeuAt=Date.now();
    l.tentativas[i].horaResp=new Date().getHours();
  }
  if(i===0&&!l.prospectadoEm&&['msg-enviada','nao-atendeu','caiu','rejeitou','ocupado','respondeu','enviada','atendeu'].includes(res))l.prospectadoEm=Date.now();
  
  // CRIAR PRÓXIMA TENTATIVA AUTOMATICAMENTE
  const dias=getDias(l.funnel);
  const diaConfig=dias.find(d=>d.id===l.diaProsp)||dias[0];
  if(diaConfig.tentativas&&diaConfig.tentativas.length>i+1){
    // Tem mais tentativas configuradas para esse dia
    const proximaTent=diaConfig.tentativas[i+1];
    // Se não existe ainda, cria
    if(!l.tentativas[i+1]){
      l.tentativas.push({
        tipo:proximaTent.tipo,
        resultado:'',
        obs:'',
        data:null,
        hora:null,
        horaResp:null
      });
    }
  }
  
  saveLeadLocal(l);
  // Re-renderiza mantendo a caixinha aberta
  const ld=document.getElementById('lead-detail');
  if(ld)ld.innerHTML=renderLD(l);
  // Reabre a caixinha da tentativa atual
  const tb=document.getElementById(`tb-${lid}-${i}`);
  if(tb)tb.classList.add('open');
}
function setHoraResp(lid,i,h){const l=S.leads.find(x=>x.id===lid);if(!l)return;if(!l.tentativas[i])return;l.tentativas[i].horaResp=h;saveLeadLocal(l)}
function confirmarHoraResp(lid,i){
  const inp=document.getElementById(`hora-inp-${lid}-${i}`);
  const h=parseInt(inp?.value)||0;
  setHoraResp(lid,i,h);
  // Atualiza só o datetime no header da tentativa sem fechar a caixa
  const box=document.getElementById(`hora-box-${lid}-${i}`);
  if(box){box.innerHTML=`<span style="color:var(--green)">✓ horário salvo: ${h}h</span>`;}

}
function setObsT(lid,i,val){const l=S.leads.find(x=>x.id===lid);if(!l)return;if(!l.tentativas[i])return;l.tentativas[i].obs=val;saveLeadLocal(l)}

// Cria tentativas vazias baseado na configuração do dia
function criarTentativasDia(funnel,diaId){
  const dias=getDias(funnel);
  const diaConfig=dias.find(d=>d.id===diaId)||dias[0];
  if(!diaConfig.tentativas||!diaConfig.tentativas.length){
    // Fallback para estrutura antiga
    return [{tipo:'mensagem',resultado:'',obs:'',data:null,hora:null,horaResp:null}];
  }
  return diaConfig.tentativas.map(t=>({
    tipo:t.tipo,
    resultado:'',
    obs:'',
    data:null,
    hora:null,
    horaResp:null
  }));
}

// Histórico para desfazer última movimentação
let lastMove=null;
let undoTimer=null;

function moverF(lid,funil){
  const l=S.leads.find(x=>x.id===lid);if(!l)return;
  const prev=l.funnel;
  const prevDia=l.diaProsp;
  const prevTents=JSON.parse(JSON.stringify(l.tentativas||[])); // clone profundo
  
  // Guarda estado anterior para desfazer
  lastMove={lid,prevFunnel:prev,prevDia,prevTents,newFunnel:funil};
  
  l.funnel=funil;l.colAt=Date.now();
  // Corrige diaProsp para o funil de destino
  if(funil==='qualificacao'){
    l.diaProsp='q1';
    l.tentativas=criarTentativasDia('qualificacao','q1');
    if(prev==='prospeccao'){
      l.qualificadoEm=Date.now();
      l.diaQualificado=prevDia; // Salva em qual dia da prospecção qualificou
    }
  }
  if(funil==='retorno'){
    l.diaProsp='r1';
    l.tentativas=criarTentativasDia('retorno','r1');
  }
  if(funil==='prospeccao'){
    l.diaProsp='d1';
    l.tentativas=criarTentativasDia('prospeccao','d1');
  }
  if(funil==='clientes'){
    l.fechadoEm=Date.now();
    l.diaFechado=prevDia; // Salva em qual dia da qualificação/retorno fechou
    const b=new Date();
    l.toques=(S.config.toques||[]).map(t=>{const d=new Date(b);d.setDate(d.getDate()+t.dias);return{id:t.id,feito:false,dataAgendada:d.toISOString().slice(0,10)}});
  }
  saveLeadLocal(l);advQ();
  
  // Toast com botão desfazer
  const fInfo=FUNNELS.find(f=>f.id===funil)||FUNNELS[0];
  toastWithUndo(`Lead movido para ${fInfo.label}`,()=>undoMove());
}
window.moverF=moverF;

function undoMove(){
  if(!lastMove)return;
  const l=S.leads.find(x=>x.id===lastMove.lid);
  if(!l)return;
  
  // Reverte para estado anterior
  l.funnel=lastMove.prevFunnel;
  l.diaProsp=lastMove.prevDia;
  l.tentativas=lastMove.prevTents;
  l.colAt=Date.now();
  
  saveLeadLocal(l);
  UI.workFunnel=lastMove.prevFunnel;
  UI.workActive=lastMove.lid;
  lastMove=null;
  render();
  toast('✓ Desfeito!');
}
window.undoMove=undoMove;

function toastWithUndo(msg,undoFn){
  const t=document.getElementById('toast');
  t.innerHTML=`${msg} <button onclick="undoMove()" style="margin-left:12px;padding:4px 10px;background:var(--accent);color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:600;font-size:11px">↩ Desfazer</button>`;
  t.classList.add('show');
  
  // Remove após 5 segundos
  clearTimeout(undoTimer);
  undoTimer=setTimeout(()=>{
    t.classList.remove('show');
    lastMove=null; // limpa histórico
  },5000);
}

function salvaTq(lid){const l=S.leads.find(x=>x.id===lid);if(!l)return;const tid=document.getElementById('at-tipo').value;const data=document.getElementById('at-data').value;if(!l.toques)l.toques=[];l.toques.push({id:tid,feito:false,dataAgendada:data});l.toques.sort((a,b)=>new Date(a.dataAgendada)-new Date(b.dataAgendada));saveLeadLocal(l);closeModal();selectLead(lid);toast('toque adicionado!')}
// Helper: salva lead localmente e sincroniza com Supabase
function saveLeadLocal(l){
  if(!l)return;
  const idx=S.leads.findIndex(x=>x.id===l.id);
  if(idx>=0)S.leads[idx]=l;
  saveLead(l).catch(e=>console.warn('sync lead',e));
}
function updF(lid,field,val){const l=S.leads.find(x=>x.id===lid);if(l){l[field]=val;saveLeadLocal(l)}}
// Sobrescreve deleteLead para usar nova lógica
async function excluirLeadDB(id){
  S.leads=S.leads.filter(l=>l.id!==id);
  try{await sb.from('leads').delete().eq('id',id)}catch(e){}
  closeModal();advQ();toast('lead excluído');
}
function delLead(id){excluirLeadDB(id)}

function dropK(e,diaId){
  e.preventDefault();
  document.querySelectorAll('.k-col').forEach(c=>c.classList.remove('drag-over'));
  if(!dragId)return;
  const l=S.leads.find(x=>x.id===dragId);
  if(l){
    const prevDia=l.diaProsp;
    // Guarda estado para desfazer
    lastMove={lid:l.id,prevFunnel:l.funnel,prevDia,prevTents:l.tentativas,newFunnel:l.funnel,isDayChange:true};
    
    l.diaProsp=diaId;
    l.colAt=Date.now();
    saveLeadLocal(l);
    renderKanban();
    
    const dias=getDias(l.funnel);
    const diaInfo=dias.find(d=>d.id===diaId)||dias[0];
    toastWithUndo(`Movido para ${diaInfo.label}`,()=>undoMove());
  }
}
window.dropK=dropK;
function goWork(id){
  const l=S.leads.find(x=>x.id===id);if(!l)return;
  UI.workFunnel=l.funnel;
  UI.workActive=id;
  setTab('work');
  // Força abertura do lead mesmo fora da fila ativa
  setTimeout(()=>{
    const ld=document.getElementById('lead-detail');
    const lf=S.leads.find(x=>x.id===id);
    if(ld&&lf)ld.innerHTML=renderLD(lf);
  },50);
}

function renderRelContent(rtab){
  const periodo=UI.relPeriodo||'semana';
  const ra=S.config.relatoriosAtivos||{};
  const par=S.config.params||{respProsp:20,fechQualif:25,convRetorno:40};
  const allLeads=filterLeadsByPeriod(S.leads);
  const total=allLeads.length,resp=allLeads.filter(l=>l.respondeuAt).length,fech=allLeads.filter(l=>l.fechado).length;
  const desc=allLeads.filter(l=>l.funnel==='descartado').length,rmk=allLeads.filter(l=>l.funnel==='remarketing').length,ret=S.leads.filter(l=>l.funnel==='retorno').length;
  const txR=total>0?Math.round(resp/total*100):0,txF=resp>0?Math.round(fech/resp*100):0;
  const comR=allLeads.filter(l=>l.respondeuAt&&l.colAt);
  const tM=comR.length>0?Math.round(comR.reduce((a,l)=>a+(l.respondeuAt-l.colAt),0)/comR.length/3600000):0;

  const horas=Array(24).fill(0);
  allLeads.forEach(l=>{(l.tentativas||[]).forEach(t=>{if((t.resultado==='respondeu'||t.resultado==='agendou')&&t.horaResp!=null)horas[t.horaResp]++;});});
  const blocos=['6h','9h','12h','15h','18h','21h'];
  const bV=[0,1,2,3,4,5].map(i=>horas[6+i*3]+(horas[7+i*3]||0)+(horas[8+i*3]||0));
  const maxB=Math.max(...bV,1),melB=blocos[bV.indexOf(Math.max(...bV))];
  const dSem=['dom','seg','ter','qua','qui','sex','sáb'];
  const pDia=Array(7).fill(0);allLeads.forEach(l=>{if(l.respondeuAt)pDia[new Date(l.respondeuAt).getDay()]++;});
  const maxD=Math.max(...pDia,1);
  const pTent=Array(5).fill(0);allLeads.forEach(l=>{(l.tentativas||[]).forEach((t,i)=>{if(t.resultado==='respondeu')pTent[Math.min(i,4)]++;});});
  const maxT=Math.max(...pTent,1);
  const amostPequena=total<10;

  const insights=[];
  if(amostPequena)insights.push({t:'info',m:`⚠️ amostra pequena (${total} leads no período). use por pelo menos 30 dias para diagnósticos mais precisos.`});
  if(!amostPequena){
    if(txR<par.respProsp)insights.push({t:'warn',m:`📉 taxa de resposta (${txR}%) abaixo do ideal (${par.respProsp}%). possível causa: público pouco qualificado. sugestão: revisar segmentação com o marketing.`});
    else insights.push({t:'ok',m:`✅ taxa de resposta (${txR}%) dentro do esperado. público bem qualificado!`});
    if(resp>0&&txF<par.fechQualif)insights.push({t:'warn',m:`📉 taxa de fechamento (${txF}%) abaixo do ideal (${par.fechQualif}%). possível causa: objeções não tratadas. sugestão: revisar scripts da qualificação.`});
    else if(txF>0)insights.push({t:'ok',m:`✅ taxa de fechamento (${txF}%) dentro do esperado. abordagem funcionando!`});
    if(melB)insights.push({t:'info',m:`🕐 pico de respostas às ${melB}. priorize contatos nesse horário.`});
  }

  const steps=[
    {l:'entraram',v:total,c:'#e8c547',pct:100,min:null,tip:'total de leads cadastrados no período selecionado.'},
    {l:'responderam',v:resp,c:'#60a5fa',pct:txR,min:par.respProsp,tip:`de cada 100 leads, quantos responderam. meta mínima: ${par.respProsp}%. abaixo pode indicar problema no público da campanha.`},
    {l:'fecharam',v:fech,c:'#4ade80',pct:txF,min:par.fechQualif,tip:`de quem respondeu, quantos fecharam negócio. meta mínima: ${par.fechQualif}%. abaixo pode indicar problema na abordagem.`},
    {l:'remarketing',v:rmk,c:'#fb923c',pct:total>0?Math.round(rmk/total*100):0,min:null,tip:'leads que não responderam após todas as tentativas. podem ser reativados em campanhas futuras.'},
    {l:'descartados',v:desc,c:'#f87171',pct:total>0?Math.round(desc/total*100):0,min:null,tip:'leads sem perfil ou sem interesse. ajuda a calibrar o público da campanha.'},
  ];

  const metas=S.config.metas||{prosp:{valor:20,periodo:'dia'},qualif:{valor:5,periodo:'semana'},fech:{valor:7,periodo:'semana'}};
  const cProsp=getMetaCount('prospectadoEm',metas.prosp.periodo);
  const cQualif=getMetaCount('qualificadoEm',metas.qualif.periodo);
  const cFech=getMetaCount('fechadoEm',metas.fech.periodo);
  const hoje=new Date().toISOString().slice(0,10);
  const novosHoje=S.leads.filter(l=>{
    const dE=l.dataEntrada?new Date(l.dataEntrada).toISOString().slice(0,10):new Date(l.colAt).toISOString().slice(0,10);
    return l.funnel==='prospeccao'&&!l.fechado&&dE===hoje;
  }).length;

  if(rtab==='geral')return`<div class="report-grid">
    ${ra.funil!==false?`<div class="report-card"><div class="report-title">📊 funil de conversão ${tip('mostra quantos leads passaram por cada etapa. identifica onde os leads estão saindo.')}</div><div class="report-desc">de cada 100 leads que entram, quantos chegam até o fechamento?</div>${steps.map(s=>`<div class="funnel-step"><div class="funnel-step-label">${s.l} ${tip(s.tip)}</div><div class="funnel-step-bar"><div class="funnel-step-fill" style="width:${Math.max(s.pct,s.v>0?8:0)}%;background:${s.c}">${s.v>0?s.v:''}</div></div><div class="funnel-step-pct" style="color:${s.c}">${s.pct}%</div>${s.min!==null?`<div class="funnel-step-ok" style="background:${s.pct>=s.min?'var(--green-bg)':'var(--red-bg)'};color:${s.pct>=s.min?'var(--green)':'var(--red)'}">${s.pct>=s.min?'✓':'!'}</div>`:'<div style="width:16px"></div>'}</div>`).join('')}</div>`:''}
    ${ra.indicadores!==false?`<div class="report-card"><div class="report-title">🎯 indicadores chave ${tip('os números mais importantes para avaliar a saúde do processo de vendas.')}</div><div class="report-desc">métricas que mostram onde o processo está funcionando e onde precisa de atenção.</div>
      <div class="stat-row"><span style="font-size:13px;color:var(--text2)">taxa de resposta ${tip(`de cada 100 leads, quantos responderam. abaixo de ${par.respProsp}% indica problema no público.`)}</span><span style="font-size:16px;font-weight:600;color:${txR>=par.respProsp?'var(--green)':'var(--red)'}">${txR}%</span></div>
      <div class="stat-row"><span style="font-size:13px;color:var(--text2)">taxa de fechamento ${tip(`de quem respondeu, quantos fecharam. abaixo de ${par.fechQualif}% indica problema na abordagem.`)}</span><span style="font-size:16px;font-weight:600;color:${txF>=par.fechQualif?'var(--green)':'var(--red)'}">${txF}%</span></div>
      <div class="stat-row"><span style="font-size:13px;color:var(--text2)">tempo médio p/ resposta ${tip('quanto tempo em média o lead demora para responder. quanto menor, mais quente é o público.')}</span><span style="font-size:16px;font-weight:600;color:var(--accent)">${Math.abs(tM)}h</span></div>
      <div class="stat-row"><span style="font-size:13px;color:var(--text2)">melhor horário ${tip('horário em que mais leads respondem. priorize contatos nesse período.')}</span><span style="font-size:16px;font-weight:600;color:var(--orange)">${melB}</span></div>
      <div class="stat-row"><span style="font-size:13px;color:var(--text2)">clientes ativos</span><span style="font-size:16px;font-weight:600;color:var(--green)">${S.leads.filter(l=>l.funnel==='clientes').length}</span></div>
      <div class="stat-row"><span style="font-size:13px;color:var(--text2)">em retorno futuro</span><span style="font-size:16px;font-weight:600;color:var(--purple)">${ret}</span></div>
    </div>`:''}
    ${ra.horario!==false?`<div class="report-card"><div class="report-title">🕐 melhor horário ${tip('em qual bloco de horário os leads mais respondem. use para planejar os contatos.')}</div><div class="report-desc">em qual horário do dia os leads costumam responder?</div><div class="hora-chart">${bV.map((v,i)=>`<div class="hora-bar-wrap"><div class="hora-bar" style="height:${Math.round(v/maxB*70)+2}px;background:${i===bV.indexOf(Math.max(...bV))?'var(--accent)':'var(--bg4)'}"></div><div style="font-size:9px;color:var(--text3)">${blocos[i]}</div></div>`).join('')}</div><div style="font-size:11px;color:var(--text2);margin-top:8px;text-align:center">pico às ${melB}</div></div>`:''}
    ${ra.diasSemana!==false?`<div class="report-card"><div class="report-title">📅 dias da semana ${tip('em qual dia da semana os leads mais respondem.')}</div><div class="report-desc">quando durante a semana os leads estão mais receptivos?</div><div class="semana-chart">${dSem.map((d,i)=>`<div class="semana-col"><div style="font-size:10px;font-weight:600;color:var(--text2)">${pDia[i]}</div><div class="semana-bar-wrap"><div class="semana-bar" style="height:${Math.round(pDia[i]/maxD*100)}%;background:${i===pDia.indexOf(Math.max(...pDia))?'var(--accent)':'var(--green)'}"></div></div><div style="font-size:10px;color:var(--text3)">${d}</div></div>`).join('')}</div></div>`:''}
    ${ra.tentativas!==false?`<div class="report-card full"><div class="report-title">📈 em qual tentativa respondem? ${tip('mostra se vale fazer todas as tentativas ou se quem não responde nas primeiras raramente responde depois.')}</div><div class="report-desc">isso define se vale ir até a última tentativa ou encerrar antes.</div><div style="display:flex;gap:8px;align-items:flex-end;height:80px">${pTent.map((v,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="font-size:11px;font-weight:600;color:var(--text2)">${v}</div><div style="width:100%;background:${v===Math.max(...pTent)&&v>0?'var(--accent)':'var(--bg4)'};border-radius:4px 4px 0 0;height:${Math.round(v/maxT*60)+4}px"></div><div style="font-size:10px;color:var(--text3)">tent. ${i+1}</div></div>`).join('')}</div></div>`:''}
    ${ra.insights!==false&&insights.length?`<div class="report-card full"><div class="report-title">💡 diagnóstico automático ${tip('interpretação automática dos números com sugestões de onde agir.')}</div><div class="report-desc">o que os números estão dizendo sobre o processo de vendas.</div>${insights.map(ins=>`<div class="insight-box ${ins.t}">${ins.m}</div>`).join('')}</div>`:''}
  </div>`;

  // NOVO RELATÓRIO: Produtividade Diária
  if(rtab==='produtividade'){
    // Determina período
    let dataInicio, dataFim;
    const hoje=new Date().toISOString().slice(0,10);
    
    if(periodo==='hoje'){
      dataInicio=hoje;
      dataFim=hoje;
    }else if(periodo==='semana'){
      const d=new Date();
      d.setDate(d.getDate()-7);
      dataInicio=d.toISOString().slice(0,10);
      dataFim=hoje;
    }else if(periodo==='mes'){
      const d=new Date();
      d.setDate(d.getDate()-30);
      dataInicio=d.toISOString().slice(0,10);
      dataFim=hoje;
    }else if(periodo==='personalizado'){
      dataInicio=UI.relDataDe||hoje;
      dataFim=UI.relDataAte||hoje;
    }else{
      dataInicio=hoje;
      dataFim=hoje;
    }
    
    const periodoTexto=periodo==='hoje'?new Date().toLocaleDateString('pt-BR'):
                       periodo==='semana'?'últimos 7 dias':
                       periodo==='mes'?'últimos 30 dias':
                       `${new Date(dataInicio).toLocaleDateString('pt-BR')} a ${new Date(dataFim).toLocaleDateString('pt-BR')}`;
    
    // Cadastrados no período (por data de cadastro)
    const cadastradosPeriodo=S.leads.filter(l=>{
      const dC=new Date(l.colAt).toISOString().slice(0,10);
      return dC>=dataInicio&&dC<=dataFim;
    });
    
    // Qualificados no período
    const qualificadosPeriodo=S.leads.filter(l=>{
      if(!l.qualificadoEm)return false;
      const dQ=new Date(l.qualificadoEm).toISOString().slice(0,10);
      return dQ>=dataInicio&&dQ<=dataFim;
    });
    
    // Fechados no período
    const fechadosPeriodo=S.leads.filter(l=>{
      if(!l.fechadoEm)return false;
      const dF=new Date(l.fechadoEm).toISOString().slice(0,10);
      return dF>=dataInicio&&dF<=dataFim;
    });
    
    // Prospectados no período (primeira tentativa feita)
    const prospectadosPeriodo=S.leads.filter(l=>{
      if(!l.prospectadoEm)return false;
      const dP=new Date(l.prospectadoEm).toISOString().slice(0,10);
      return dP>=dataInicio&&dP<=dataFim;
    });

    // Breakdown de cadastrados por data de entrada
    const cadastradosPeriodoEntrada=cadastradosPeriodo.filter(l=>{
      const dE=l.dataEntrada?new Date(l.dataEntrada).toISOString().slice(0,10):new Date(l.colAt).toISOString().slice(0,10);
      return dE>=dataInicio&&dE<=dataFim;
    });
    const cadastradosHojeEntrada=cadastradosPeriodoEntrada.length;
    const cadastradosAntigos=cadastradosPeriodo.length-cadastradosHojeEntrada;

    // Breakdown de qualificados por data de entrada
    const qualHojeEntrada=qualificadosPeriodo.filter(l=>{
      const dE=l.dataEntrada?new Date(l.dataEntrada).toISOString().slice(0,10):new Date(l.colAt).toISOString().slice(0,10);
      return dE>=dataInicio&&dE<=dataFim;
    }).length;
    const qualAntigos=qualificadosPeriodo.length-qualHojeEntrada;

    // Breakdown de fechados por data de entrada
    const fechHojeEntrada=fechadosPeriodo.filter(l=>{
      const dE=l.dataEntrada?new Date(l.dataEntrada).toISOString().slice(0,10):new Date(l.colAt).toISOString().slice(0,10);
      return dE>=dataInicio&&dE<=dataFim;
    }).length;
    const fechAntigos=fechadosPeriodo.length-fechHojeEntrada;

    return`<div class="report-grid">
      <div class="report-card full"><div class="report-title">⚡ O QUE EU FIZ (${periodoTexto.toUpperCase()})</div>
        <div class="report-desc">resultado do trabalho no período — inclui leads que entraram no período e leads antigos</div>
        
        <div style="margin:16px 0;padding:12px;background:var(--bg3);border-radius:8px">
          <div class="stat-row"><span style="font-size:14px;font-weight:600;color:var(--text)">📥 Cadastrei</span><span style="font-size:20px;font-weight:600;color:var(--orange)">${cadastradosPeriodo.length}</span></div>
          ${cadastradosPeriodo.length>0?`<div style="margin-top:8px;padding-left:16px;font-size:12px;color:var(--text3)">
            • ${cadastradosHojeEntrada} que entraram no período<br>
            • ${cadastradosAntigos} que entraram antes
          </div>`:''}
        </div>

        <div style="margin:16px 0;padding:12px;background:var(--bg3);border-radius:8px">
          <div class="stat-row"><span style="font-size:14px;font-weight:600;color:var(--text)">💬 Prospectei</span><span style="font-size:20px;font-weight:600;color:var(--accent)">${prospectadosPeriodo.length}</span></div>
          <div style="margin-top:8px;padding-left:16px;font-size:12px;color:var(--text3)">total de tentativas de contato feitas</div>
        </div>

        <div style="margin:16px 0;padding:12px;background:var(--bg3);border-radius:8px">
          <div class="stat-row"><span style="font-size:14px;font-weight:600;color:var(--text)">✅ Qualifiquei</span><span style="font-size:20px;font-weight:600;color:var(--blue)">${qualificadosPeriodo.length}</span></div>
          ${qualificadosPeriodo.length>0?`<div style="margin-top:8px;padding-left:16px;font-size:12px;color:var(--text3)">
            • ${qualHojeEntrada} que entraram no período<br>
            • ${qualAntigos} que entraram antes
          </div>`:''}
        </div>

        <div style="margin:16px 0;padding:12px;background:var(--bg3);border-radius:8px">
          <div class="stat-row"><span style="font-size:14px;font-weight:600;color:var(--text)">🎉 Fechei</span><span style="font-size:20px;font-weight:600;color:var(--green)">${fechadosPeriodo.length}</span></div>
          ${fechadosPeriodo.length>0?`<div style="margin-top:8px;padding-left:16px;font-size:12px;color:var(--text3)">
            • ${fechHojeEntrada} que entraram no período<br>
            • ${fechAntigos} que entraram antes
          </div>`:''}
        </div>
      </div>
    </div>`;
  }

  // NOVO RELATÓRIO: Análise de Funil
  if(rtab==='analise_funil'){
    // Determina range de datas baseado no período
    const hoje=new Date().toISOString().slice(0,10);
    let dataInicio='';
    let dataFim=hoje;
    
    if(periodo==='hoje'){
      dataInicio=hoje;
    }else if(periodo==='semana'){
      const d=new Date();
      d.setDate(d.getDate()-7);
      dataInicio=d.toISOString().slice(0,10);
    }else if(periodo==='mes'){
      const d=new Date();
      d.setDate(d.getDate()-30);
      dataInicio=d.toISOString().slice(0,10);
    }else if(periodo==='personalizado'){
      dataInicio=UI.relDataDe||'';
      dataFim=UI.relDataAte||hoje;
    }
    
    // Agrupa leads por data de entrada (filtrado por período)
    const porLote={};
    S.leads.forEach(l=>{
      // Extrai só a data, ignorando horário
      let dE;
      if(l.dataEntrada){
        dE=new Date(l.dataEntrada).toISOString().slice(0,10);
      }else{
        dE=new Date(l.colAt).toISOString().slice(0,10);
      }
      
      // Filtra por período (comparação string funciona pois formato é YYYY-MM-DD)
      if(dataInicio&&dE<dataInicio)return;
      if(dataFim&&dE>dataFim)return;
      
      if(!porLote[dE])porLote[dE]={data:dE,total:0,qualificados:0,fechados:0,porDia:{}};
      porLote[dE].total++;
      if(l.qualificadoEm){
        porLote[dE].qualificados++;
        const diaQ=l.diaQualificado||'d1';
        if(!porLote[dE].porDia[diaQ])porLote[dE].porDia[diaQ]=0;
        porLote[dE].porDia[diaQ]++;
      }
      if(l.fechadoEm)porLote[dE].fechados++;
    });

    const lotes=Object.values(porLote).sort((a,b)=>b.data.localeCompare(a.data));
    const periodoTexto={hoje:'hoje',semana:'últimos 7 dias',mes:'últimos 30 dias',personalizado:'período selecionado'}[periodo]||'período';

    return`<div class="report-grid">
      <div class="report-card full"><div class="report-title">🔬 ANÁLISE DE FUNIL POR LOTE</div>
        <div class="report-desc">taxa de conversão dos leads por data de entrada — ${periodoTexto}</div>
        ${lotes.length===0?`<div style="padding:40px;text-align:center;color:var(--text3)">Nenhum lead cadastrado no período selecionado</div>`:''}
        ${lotes.map(lote=>{
          const txQ=lote.total>0?Math.round(lote.qualificados/lote.total*100):0;
          const txF=lote.total>0?Math.round(lote.fechados/lote.total*100):0;
          const dataF=new Date(lote.data).toLocaleDateString('pt-BR');
          return`<div style="margin:16px 0;padding:14px;background:var(--bg3);border-radius:8px;border:1px solid var(--border)">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
              <span style="font-size:13px;font-weight:600;color:var(--accent)">📅 ${dataF}</span>
              <span style="font-size:12px;color:var(--text3)">${lote.total} leads</span>
            </div>
            <div class="stat-row" style="margin:8px 0">
              <span style="font-size:12px;color:var(--text2)">✅ Qualificados</span>
              <span style="font-size:15px;font-weight:600;color:var(--blue)">${lote.qualificados} (${txQ}%)</span>
            </div>
            <div class="stat-row" style="margin:8px 0">
              <span style="font-size:12px;color:var(--text2)">🎉 Fechados</span>
              <span style="font-size:15px;font-weight:600;color:var(--green)">${lote.fechados} (${txF}%)</span>
            </div>
            ${Object.keys(lote.porDia).length>0?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border2)">
              <div style="font-size:11px;color:var(--text3);margin-bottom:6px">Qualificaram em:</div>
              ${Object.entries(lote.porDia).map(([dia,qtd])=>`<span style="display:inline-block;margin:2px 4px;padding:2px 8px;background:var(--bg4);border-radius:12px;font-size:10px;color:var(--text2)">${dia}: ${qtd}</span>`).join('')}
            </div>`:''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  if(rtab==='vendedor')return`<div class="report-grid">
    <div class="report-card full"><div class="report-title">👤 performance do vendedor</div><div class="report-desc">progresso das metas configuradas.</div>
      ${[
        {l:'prospectados',v:cProsp,max:metas.prosp.valor,per:metas.prosp.periodo,c:'var(--orange)',tip:'leads que receberam o primeiro contato no período.'},
        {l:'qualificados',v:cQualif,max:metas.qualif.valor,per:metas.qualif.periodo,c:'var(--blue)',tip:'leads movidos para qualificação no período.'},
        {l:'fechamentos',v:cFech,max:metas.fech.valor,per:metas.fech.periodo,c:'var(--green)',tip:'negócios fechados no período.'},
      ].map(m=>`<div class="funnel-step"><div class="funnel-step-label">${m.l} ${tip(m.tip)}<br><span style="font-size:10px;color:var(--text3)">${PERIODOS[m.per]||''}</span></div><div class="funnel-step-bar"><div class="funnel-step-fill" style="width:${Math.min(100,Math.round(m.v/m.max*100))}%;background:${m.c}">${m.v>0?m.v:''}</div></div><div class="funnel-step-pct" style="color:${m.c}">${m.v}/${m.max}</div><div class="funnel-step-ok" style="background:${m.v>=m.max?'var(--green-bg)':'var(--red-bg)'};color:${m.v>=m.max?'var(--green)':'var(--red)'}">${m.v>=m.max?'✓':'!'}</div></div>`).join('')}
    </div>
    <div class="report-card full"><div class="report-title">📊 volume de leads</div>
      <div class="stat-row"><span style="font-size:13px;color:var(--text2)">novos leads hoje ${tip('leads que entraram no sistema hoje.')}</span><span style="font-size:16px;font-weight:600;color:var(--orange)">${novosHoje}</span></div>
      <div class="stat-row"><span style="font-size:13px;color:var(--text2)">prospectados hoje ${tip('dos que chegaram, quantos receberam o primeiro contato.')}</span><span style="font-size:16px;font-weight:600;color:var(--accent)">${cProsp}</span></div>
      <div class="stat-row"><span style="font-size:13px;color:var(--text2)">acumulando sem contato ${tip('leads que chegaram mas ainda não foram contactados. se crescer muito, o vendedor pode estar sobrecarregado.')}</span><span style="font-size:16px;font-weight:600;color:${Math.max(0,novosHoje-cProsp)>5?'var(--red)':'var(--green)'}">${Math.max(0,novosHoje-cProsp)}</span></div>
    </div>
  </div>`;

  return`<div style="padding:40px;text-align:center;color:var(--text3)"><div style="font-size:32px;opacity:.3;margin-bottom:12px">📊</div><div style="font-size:14px;font-weight:500;margin-bottom:8px">relatório em construção</div><div style="font-size:12px">continue usando o sistema para acumular dados.</div></div>`;
}

// ═══ CONFIG ═══
function renderConfig(){
  const ct=UI.configTab||'clinica';
  document.getElementById('main').innerHTML=`
  <div style="display:flex;flex-direction:column;flex:1;overflow:hidden">
    <div class="filter-bar">
      ${[{id:'clinica',label:'🏥 clínica'},{id:'vendedor',label:'👤 vendedor'},{id:'usuarios',label:'👥 usuários'},{id:'scripts',label:'💬 scripts'},{id:'materiais',label:'📎 materiais'},{id:'relatorios',label:'📊 relatórios'},{id:'importar',label:'⬆ importar/exportar'}].map(t=>`<button class="filter-btn ${ct===t.id?'active':''}" onclick="UI.configTab='${t.id}';renderConfig()">${t.label}</button>`).join('')}
    </div>
    <div class="config-wrap"><div style="max-width:860px">
      ${ct==='clinica'?rCfgClinica():ct==='vendedor'?rCfgVendedor():ct==='usuarios'?rCfgUsuarios():ct==='scripts'?rCfgScripts():ct==='materiais'?rCfgMateriais():ct==='relatorios'?rCfgRelatorios():rCfgImportar()}
    </div></div>
  </div>`;
  if(ct==='usuarios')setTimeout(()=>carregarUsuariosCfg(),50);
}
function subBar(items,current,key){
  return`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">${items.map(s=>`<button class="filter-btn ${current===s.id?'active':''}" onclick="setSubTab('${key}','${s.id}')">${s.label}</button>`).join('')}</div>`;
}
function setSubTab(key,val){if(!UI.configSubTab)UI.configSubTab={};UI.configSubTab[key]=val;renderConfig();}

    <button class="btn sm" onclick="if(!S.config.enderecos)S.config.enderecos=[];S.config.enderecos.push({nome:'',endereco:''});save();renderConfig()">+ adicionar endereço</button>
  </div>`:''}
  ${sa||sub==='pix'?`<div class="config-block"><h3>💳 chaves pix</h3>
    <p style="font-size:12px;color:var(--text2);margin-bottom:14px">o apelido aparece no botão rápido. adicione quantas chaves quiser.</p>
    ${(S.config.pixes||[]).map((p,i)=>`<div class="pix-item"><input class="form-input" value="${esc(p.apelido||'')}" style="width:160px;flex-shrink:0" placeholder="apelido (ex: pix nubank)" onblur="S.config.pixes[${i}].apelido=this.value;save()"><textarea class="form-input" style="flex:1;min-height:50px" placeholder="Chave pix ou informações..." onblur="S.config.pixes[${i}].chave=this.value;save()">${esc(p.chave||'')}</textarea><button class="btn sm danger" onclick="S.config.pixes.splice(${i},1);save();renderConfig()">✕</button></div>`).join('')}
    <button class="btn sm" style="margin-bottom:20px" onclick="if(!S.config.pixes)S.config.pixes=[];S.config.pixes.push({apelido:'',chave:''});save();renderConfig()">+ adicionar pix</button>
  </div>
  <div class="config-block"><h3>🏦 dados bancários</h3>
    ${(S.config.dadosBancarios||[]).map((d,i)=>`<div style="background:var(--bg3);border-radius:var(--brl);padding:12px;margin-bottom:10px"><div class="form-row"><div class="form-group"><label class="form-label">apelido</label><input class="form-input" value="${esc(d.apelido||'')}" placeholder="ex: conta bradesco" onblur="S.config.dadosBancarios[${i}].apelido=this.value;save()"></div><div class="form-group"><label class="form-label">banco</label><input class="form-input" value="${esc(d.banco||'')}" onblur="S.config.dadosBancarios[${i}].banco=this.value;save()"></div></div><div class="form-row"><div class="form-group"><label class="form-label">agência</label><input class="form-input" value="${esc(d.agencia||'')}" onblur="S.config.dadosBancarios[${i}].agencia=this.value;save()"></div><div class="form-group"><label class="form-label">conta</label><input class="form-input" value="${esc(d.conta||'')}" onblur="S.config.dadosBancarios[${i}].conta=this.value;save()"></div></div><div class="form-row"><div class="form-group"><label class="form-label">titular</label><input class="form-input" value="${esc(d.titular||'')}" onblur="S.config.dadosBancarios[${i}].titular=this.value;save()"></div><div class="form-group" style="align-items:flex-end"><button class="btn sm danger" onclick="S.config.dadosBancarios.splice(${i},1);save();renderConfig()">✕ remover</button></div></div></div>`).join('')}
    <button class="btn sm" onclick="if(!S.config.dadosBancarios)S.config.dadosBancarios=[];S.config.dadosBancarios.push({apelido:'',banco:'',agencia:'',conta:'',titular:''});save();renderConfig()">+ adicionar conta bancária</button>
  </div>`:''}
  ${sa||sub==='horarios'?`<div class="config-block"><h3>🕐 horários de funcionamento</h3>

    <button class="btn primary" onclick="S.config.horarios=document.getElementById('c-hor').value.trim();save();toast('salvo!')">salvar</button>
  </div>`:''}
  ${sa||sub==='dados'?`<div class="config-block" style="border-color:rgba(248,113,113,.2)"><h3 style="color:var(--red)">⚠ zona de perigo</h3>
    <div class="danger-zone">
      <button class="btn danger" onclick="confirmReset()">resetar todos os dados</button>
      <div style="font-size:12px;color:var(--text3);line-height:1.6">use quando quiser começar do zero — por exemplo, ao passar o sistema para uma nova clínica ou limpar dados de teste. apaga todos os leads, histórico e configurações. <strong style="color:var(--red)">irreversível.</strong></div>
    </div>
  </div>`:''}`;
}

  `<button class="btn primary" onclick="closeModal()">cancelar — não resetar</button><button class="btn danger" onclick="localStorage.removeItem('crm_data_'+empresaId);location.reload()">sim, apagar tudo</button>`);
}

function rCfgVendedor(){
  const sub=UI.configSubTab?.vendedor||'todos';
  // Pega vendedores da config (sincronizados dos perfis)
  const vendedores=S.config.vendedores||[];
  const subs=[{id:'todos',label:'todos'},...vendedores.map(v=>({id:v.uid,label:v.nome||v.email})),{id:'params',label:'parâmetros'}];
  const sa=sub==='todos';
  const metas=S.config.metas||{prosp:{valor:20,periodo:'dia'},qualif:{valor:5,periodo:'semana'},fech:{valor:7,periodo:'semana'}};

async function sincVendedores(){
  if(!empresaId){toast('erro: empresa não carregada.');return;}
  showLoading('sincronizando...');
  try{
    const{data,error}=await sb.from('perfis').select('*').eq('empresa_id',empresaId).eq('ativo',true);
    if(error){toast('erro: '+error.message);hideLoading();return;}
    if(data&&data.length){
      const relevantes=data.filter(p=>!(p.id===USER?.id&&p.perfil==='superadmin'));
      // Reconstrói lista — remove excluídos, mantém configs dos existentes
      S.config.vendedores=relevantes.map(p=>{
        const ex=(S.config.vendedores||[]).find(v=>v.uid===p.id);
        return ex?{...ex,email:p.email,nome:p.nome||p.email,perfil:p.perfil}:
          {uid:p.id,email:p.email,nome:p.nome||p.email,perfil:p.perfil,comissao:10,mostrarMetas:true,metas:null};
      });
      save();toast(relevantes.length+' usuário(s) sincronizado(s)!');
    }else{S.config.vendedores=[];save();toast('nenhum usuário encontrado.');}
  }catch(e){toast('erro: '+e.message);}
  hideLoading();renderConfig();
}

  const csv=[header,ex1,ex2,ex3,ex4,'','',''].join('\n');

function importarCSV(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const lines=e.target.result.split('\n').filter(l=>l.trim());
    const header=lines[0].split(',').map(h=>h.trim().toLowerCase());
    let importados=0,erros=0;
    for(let i=1;i<lines.length;i++){
      const cols=lines[i].split(',').map(c=>c.trim().replace(/^"|"$/g,''));
      if(!cols[0]||cols[0].toUpperCase()==='EXEMPLO')continue;
      const obj={};header.forEach((h,j)=>obj[h]=cols[j]||'');
      if(!obj.telefone){erros++;continue;}
      const funnelValido=['prospeccao','qualificacao','retorno','clientes'].includes(obj.funil)?obj.funil:'prospeccao';
      const dias=getDias(funnelValido);
      const diaValido=dias.find(d=>d.id===obj.dia)?obj.dia:dias[0].id;
      const dataEntrada=obj.dataentrada||obj.data_entrada||new Date().toISOString().slice(0,10);
      S.leads.push({id:S.nid++,nome:obj.nome||'',tel:obj.telefone,funnel:funnelValido,diaProsp:diaValido,colAt:Date.now(),dataEntrada,esp:obj.especialidade||S.config.especialidade||'',valor:parseFloat(obj.valor)||0,fechado:funnelValido==='clientes',cor:'',local:'',causa:'',toques:[],retornoData:obj.retornodata||'',respondeuAt:null,prospectadoEm:null,qualificadoEm:null,fechadoEm:null,tentativas:criarTentativasDia(funnelValido,diaValido)});
      importados++;
    }
    save();input.value='';
    toast(`${importados} leads importados${erros>0?`, ${erros} ignorados`:''}!`);
    renderConfig();
  };
  reader.readAsText(file,'UTF-8');
}

// ═══ LEADS ═══

  return apenasAtivas?all.filter(c=>c.ativa!==false):all;
}

function confirmExcl(id){openModal('⚠️ excluir lead',`<div style="font-size:13px;color:var(--text2);line-height:1.6">esta ação é <strong style="color:var(--red)">irreversível</strong>. o lead será permanentemente excluído e não poderá ser recuperado.</div>`,`<button class="btn" onclick="openEdit('${id}')">← voltar</button><button class="btn danger" onclick="delLead('${id}')">sim, excluir permanentemente</button>`)}
// Normaliza telefone: remove tudo que não é dígito, formata (11) 98765-4321
function normalizarTel(t){
  const d=t.replace(/\D/g,'');
  if(d.length===11)return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  if(d.length===10)return`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  if(d.length===9)return`${d.slice(0,5)}-${d.slice(5)}`;
  if(d.length===8)return`${d.slice(0,4)}-${d.slice(4)}`;
  return d; // retorna só dígitos se não reconhecer
}
function soDigitos(t){return(t||'').replace(/\D/g,'')}

function saveLeadFromModal(){
  const telRaw=document.getElementById('fl-tel')?.value.trim();
  if(!telRaw){toast('telefone obrigatório');return}
  const tel=normalizarTel(telRaw);
  const telD=soDigitos(tel);
  const eid=document.getElementById('fl-eid')?.value;
  // Só valida duplicata ao CRIAR novo lead (não ao editar)
  if(!eid){
    const duplicado=S.leads.find(x=>soDigitos(x.tel)===telD);
  if(duplicado){
    const fInfo=FUNNELS.find(f=>f.id===duplicado.funnel)||FUNNELS[0];
    openModal('⚠️ telefone já cadastrado',`<div style="font-size:13px;color:var(--text2);line-height:1.8">
      Já existe um lead com este número:<br><br>
      <strong style="color:var(--text)">${esc(duplicado.nome||'Sem nome')}</strong><br>
      📱 ${esc(duplicado.tel)}<br>
      <span class="badge" style="background:${fInfo.color}22;color:${fInfo.color}">${fInfo.label}</span>
      <br><br>Deseja cadastrar mesmo assim?
    </div>`,
    `<button class="btn" onclick="closeModal()">cancelar</button><button class="btn danger" onclick="salvarLeadForçado('${telD}')">cadastrar mesmo assim</button>`);
    return;
    }
  }
  _salvarLead(tel,eid);
}
function salvarLeadForçado(telD){
  closeModal();
  // Re-abre modal com dados preenchidos e força salvamento
  const tel=normalizarTel(telD);
  _salvarLead(tel,null,true);
}
async function _salvarLead(tel,eid,forcar){
  const telFinal=tel||(document.getElementById('fl-tel')?.value.trim());
  const eidFinal=eid||(document.getElementById('fl-eid')?.value);
  const fid=document.getElementById('fl-fun')?.value||'prospeccao';
  const dias=getDias(fid);
  const nome=document.getElementById('fl-nome')?.value.trim()||'';
  const esp=document.getElementById('fl-esp')?.value.trim()||S.config.especialidade||'';
  const campanha=document.getElementById('fl-camp')?.value||'';
  const telNorm=normalizarTel(telFinal||'');
  const dataEntrada=document.getElementById('fl-data')?.value||'';

  if(eidFinal){
    // Edição — atualiza lead existente
    const l=S.leads.find(x=>x.id===eidFinal||x.id==eidFinal);
    if(l){
      l.nome=nome;
      l.tel=telNorm;
      l.esp=esp;
      l.funnel=fid;
      if(dataEntrada){
        l.dataEntrada=new Date(dataEntrada+'T12:00:00').toISOString();
        console.log('💾 Salvando dataEntrada:',l.dataEntrada,'para lead:',l.nome||l.tel);
      }
      saveLeadLocal(l);
    }
    closeModal();UI.workActive=eidFinal;UI.workFunnel=fid;setTab('work');toast('✓ lead salvo!');
  } else {
    // Novo lead — insere no Supabase para obter UUID
    showLoading('salvando lead...');
    try{
      const colAtDate=dataEntrada?new Date(dataEntrada+'T12:00:00').toISOString():new Date().toISOString();
      const dataEntradaISO=dataEntrada?new Date(dataEntrada+'T12:00:00').toISOString():new Date().toISOString();
      const row={empresa_id:empresaId,nome,tel:telNorm,funnel:fid,dia_prosp:dias[0].id,
        esp,campanha,vendedor_id:USER?.id||null,vendedor_nome:USER?.nome||USER?.email||'',
        valor:0,fechado:false,tentativas:criarTentativasDia(fid,dias[0].id),
        toques:[],col_at:colAtDate,data_entrada:dataEntradaISO};
      const{data,error}=await sb.from('leads').insert(row).select().single();
      hideLoading();
      if(error||!data){toast('erro ao salvar — tente novamente');return;}
      const l=rowToLead(data);
      S.leads.push(l);
      closeModal();UI.workActive=l.id;UI.workFunnel=fid;setTab('work');toast('✓ lead salvo! tel: '+l.tel);
    }catch(e){hideLoading();console.error(e);toast('erro de conexão — verifique a internet');}
  }
}

function openModal(t,b,f){document.getElementById('modal-title').textContent=t;document.getElementById('modal-body').innerHTML=b;document.getElementById('modal-footer').innerHTML=f;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
function exportCSV(){
  const h=['id','nome','tel','funnel','diaProsp','esp','valor','fechado','colAt','respondeuAt','retornoData','prospectadoEm','qualificadoEm','fechadoEm'];
  const rows=S.leads.map(l=>h.map(k=>JSON.stringify(l[k]??'')).join(','));
  const b=new Blob([[h.join(','),...rows].join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='crm-leads.csv';a.click();toast('csv exportado!');

// ═══ INIT ═══
async function iniciarApp(){
  showLoading('carregando...');
  USER=await getUser();
  if(!USER){hideLoading();renderLogin();return;}
  loadUI();
  let empresas;
  if(isSuperAdmin()){
    // Superadmin vê todas as empresas — mas NÃO cria novas automaticamente
    empresas=await syncEmpresas();
    if(!empresas.length){
      // Só cria se realmente não existe nenhuma
      empresas=await initEmpresas();
    }
  } else {
    // Gestor/vendedor — só a empresa vinculada ao seu perfil
    if(USER.empresa_id){
      // Busca o nome da empresa
      const{data}=await sb.from('empresas').select('id,nome').eq('id',USER.empresa_id).single();
      empresas=[{id:USER.empresa_id,nome:data?.nome||''}];
      saveEmpresas(empresas);
    } else {
      hideLoading();
      showApp();
      document.getElementById('main').innerHTML=`<div style="display:flex;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:12px"><div style="font-size:32px">⚠️</div><div style="color:var(--text2);font-size:14px">sua conta ainda não foi vinculada a uma empresa.</div><div style="color:var(--text3);font-size:12px">fale com o administrador do sistema.</div><button class="btn" onclick="logout()">sair</button></div>`;
      return;
    }
  }
  const empAtual=getEmpresaAtual();
  const id=empAtual&&empresas.find(e=>e.id===empAtual)?empAtual:empresas[0]?.id||'';
  if(id)await loadEmpresa(id);
  hideLoading();
  showApp();
  render();
}

async function init(){
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  // Limpa cache antigo de leads e config — sempre busca do Supabase
  Object.keys(localStorage).forEach(k=>{
    if(k.startsWith('crm_leads_')||k.startsWith('crm_config_')||k.startsWith('crm_data_')||k==='crm_empresas')
      localStorage.removeItem(k);
  });
  // Timeout de 5 segundos — se não conectar, mostra login
  const timeout=new Promise(resolve=>setTimeout(()=>resolve(null),5000));
  const sessionPromise=sb.auth.getSession().then(r=>r.data?.session).catch(()=>null);
  const session=await Promise.race([sessionPromise,timeout]);
  if(session){
    await iniciarApp();
  } else {
    renderLogin();
  }
  sb.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_IN'&&!USER)await iniciarApp();
    if(event==='SIGNED_OUT'){USER=null;renderLogin();}
    if(event==='PASSWORD_RECOVERY')renderTrocarSenha();
  });
}

function renderTrocarSenha(){
  showLogin();
  document.getElementById('login-area').innerHTML=`
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px">
    <div style="width:100%;max-width:380px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--brxl);padding:24px">
      <div style="font-size:16px;font-weight:600;margin-bottom:16px">🔐 criar nova senha</div>
      <div class="form-group" style="margin-bottom:14px"><label class="form-label">nova senha</label><input class="form-input" id="ns-senha" type="password" placeholder="mínimo 6 caracteres"></div>
      <button class="btn primary" style="width:100%" onclick="trocarSenha()">salvar nova senha</button>
      <div id="ns-msg" style="margin-top:10px;font-size:12px;text-align:center;display:none"></div>
    </div>
  </div>`;
}
async function trocarSenha(){
  const senha=document.getElementById('ns-senha')?.value;
  if(!senha||senha.length<6){toast('Mínimo 6 caracteres');return;}
  const{error}=await sb.auth.updateUser({password:senha});
  const el=document.getElementById('ns-msg');
  if(error){el.style.color='var(--red)';el.textContent='Erro: '+error.message;}
  else{el.style.color='var(--green)';el.textContent='Senha alterada! Redirecionando...';setTimeout(()=>iniciarApp(),1500);}
  el.style.display='block';
}

init();
</script>
